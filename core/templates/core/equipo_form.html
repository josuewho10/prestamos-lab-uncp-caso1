{% extends 'base.html' %}
{% block title %}{{ titulo }}{% endblock title %}
{% block content %}
<h2 class="mb-4">{{ titulo }}</h2>
<div class="card">
  <div class="card-body">
    <form method="post" novalidate>
      {% csrf_token %}
      {% for field in form %}
        <div class="mb-3">
          <label class="form-label">{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}
            <div class="text-danger small mt-1">{{ field.errors.0 }}</div>
          {% endif %}
        </div>
      {% endfor %}
      <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Guardar</button>
      <a href="{% url 'equipo_list' %}" class="btn btn-secondary">Cancelar</a>
    </form>
  </div>
</div>
{% endblock content %}
